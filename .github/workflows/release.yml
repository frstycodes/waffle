# Push a `v*` tag matching Cargo.toml's version to build and publish a release: installers (.dmg,
# setup .exe) for people, plus the zipped .app and zipped Waffle.exe the updater swaps in. Asset names
# must match `asset_name` in src/updater.rs; each asset gets a `<name>.sha256` the updater verifies.
# Pushes to main run the same builds and packaging without publishing, which keeps every target
# building and fills the shared cache.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      # A draft until `publish`: releases/latest (the site's download buttons, the updater) must never point
      # at a release whose installers aren't uploaded yet. Re-running a tag keeps its release and replaces its assets.
      - run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Waffle $TAG" --generate-notes --draft

  build:
    needs: create
    # Runs on main too, where `create` is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS job builds both arches: GitHub's macOS runners are scarce, and a second macOS job
          # was often cancelled waiting for one. `files` is what the release gets: per arch a .zip the
          # updater downloads and a .dmg people install from; on Windows the .zip the updater downloads
          # and the setup .exe.
          - { os: macos-latest, cache: macos, targets: aarch64-apple-darwin x86_64-apple-darwin, files: waffle-macos-aarch64.zip waffle-macos-aarch64.dmg waffle-macos-x86_64.zip waffle-macos-x86_64.dmg }
          - { os: windows-latest, cache: x86_64-pc-windows-msvc, targets: x86_64-pc-windows-msvc, files: waffle-windows-x86_64.zip waffle-windows-x86_64-setup.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The macOS image is nearly full: two release builds plus their .dmgs ran out of space. Waffle needs
      # none of the preinstalled Android SDK, simulators, other Xcodes or language toolchains. The build's
      # own files stay, since the cache saves them on main.
      - name: Free disk space
        if: runner.os == 'macOS'
        run: |
          df -h /
          keep=$(xcode-select -p | sed 's|/Contents/Developer||')
          for x in /Applications/Xcode*.app; do [ "$x" = "$keep" ] || sudo rm -rf "$x"; done
          sudo rm -rf "$HOME/Library/Android" "$HOME/Library/Developer/CoreSimulator" /Library/Developer/CoreSimulator/Profiles/Runtimes \
            "$RUNNER_TOOL_CACHE"/{CodeQL,go,Ruby,PyPy,node} || true
          df -h /
      - run: rustup target add ${{ matrix.targets }}
      # One cache per target for all of CI: a run can restore caches saved on its own ref or on main,
      # never another tag's, so only main saves and every other ref (tags, branches) reads it.
      # Any new workflow should use the same shared-key and save-if, and build the release profile.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: waffle-${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Even on a full rust-cache hit, the crates in this repo (vendor/gpui-pre*) and everything built on
      # them recompile every run; sccache keys each compile by its inputs, so those come back too.
      # Binaries and proc-macros still compile every time: sccache only caches libraries.
      - uses: mozilla-actions/sccache-action@v0.0.11
      # GAP: Windows runs sccache built from mozilla/sccache#3026 until a release carries it (v0.19.0
      # predates it). Since v0.17 sccache expands cargo's @argfile and spawns rustc with the full list;
      # gpui-base's ~36k characters pass Windows' 32,767 limit (os error 206) whenever it isn't cached.
      # The action still sets up the GitHub cache; this binary goes first on PATH. Building it takes ~7
      # minutes, so it gets its own cache keyed by the commit (rust-cache skips saving on an exact hit,
      # so it never kept it). Drop all three steps once a release has the fix.
      - name: Restore the fixed sccache (Windows)
        if: runner.os == 'Windows'
        id: sccache-fix
        uses: actions/cache@v4
        with:
          path: ~/sccache-fix
          key: sccache-fix-${{ runner.os }}-91d34f10947e68a850f4c124ddaba0d040a921f6
      - name: Build the fixed sccache (Windows, cache miss)
        if: runner.os == 'Windows' && steps.sccache-fix.outputs.cache-hit != 'true'
        run: cargo install sccache --git https://github.com/mozilla/sccache --rev 91d34f10947e68a850f4c124ddaba0d040a921f6 --locked --root "$(cygpath -w "$HOME/sccache-fix")"
      - name: Use the fixed sccache (Windows)
        if: runner.os == 'Windows'
        run: cygpath -w "$HOME/sccache-fix/bin" >> "$GITHUB_PATH"
      - run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - run: for target in ${{ matrix.targets }}; do cargo build --release --locked --target "$target"; done
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
      - run: command -v sccache && sccache --version && sccache --show-stats

      - name: Package Waffle.app
        if: runner.os == 'macOS'
        run: |
          for target in ${{ matrix.targets }}; do
            arch=${target%%-*}
            app=build-$arch/Waffle.app
            mkdir -p $app/Contents/MacOS $app/Contents/Resources
            cp target/$target/release/waffle $app/Contents/MacOS/waffle
            cp assets/macos/AppIcon.icns $app/Contents/Resources/AppIcon.icns
            cat > $app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Waffle</string>
            <key>CFBundleDisplayName</key><string>Waffle</string>
            <key>CFBundleIdentifier</key><string>com.frstycodes.waffle</string>
            <key>CFBundleExecutable</key><string>waffle</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Waffle uses the microphone for voice calls.</string>
            <key>NSCameraUsageDescription</key><string>Waffle uses the camera for video calls.</string>
          </dict></plist>
          EOF
            # An ad-hoc signature's default requirement is its cdhash, so each release looked like a new app
            # to macOS and lost Input Monitoring. Requiring only the bundle id keeps the grant across updates.
            codesign --force --deep --sign - -r='designated => identifier "com.frstycodes.waffle"' $app
            ditto -c -k --keepParent $app waffle-macos-$arch.zip
            dmg=build-$arch/dmg
            mkdir $dmg && cp -R $app $dmg/ && ln -s /Applications $dmg/Applications
            # The mounted volume shows the app icon too: a .VolumeIcon.icns plus the custom-icon flag, which
            # only sticks when set on the mounted volume, so build read-write, flag it, then compress.
            cp assets/macos/AppIcon.icns $dmg/.VolumeIcon.icns
            hdiutil create -volname Waffle -srcfolder $dmg -format UDRW -ov build-$arch/rw.dmg
            hdiutil attach -nobrowse -mountpoint build-$arch/mnt build-$arch/rw.dmg
            SetFile -a C build-$arch/mnt
            # Spotlight can still hold the fresh volume ("couldn't eject … Resource busy"): retry, then force.
            for try in 1 2 3 4 5; do
              hdiutil detach build-$arch/mnt && break
              [ "$try" = 5 ] && hdiutil detach -force build-$arch/mnt
              sleep 3
            done
            hdiutil convert build-$arch/rw.dmg -format UDZO -ov -o waffle-macos-$arch.dmg
            # Only the zip and dmg are kept; the read-write image is the size of the app.
            rm -rf build-$arch
          done

      - name: Package exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/x86_64-pc-windows-msvc/release/waffle.exe Waffle.exe
          Compress-Archive -Path Waffle.exe -DestinationPath waffle-windows-x86_64.zip

      - name: Build setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersion=$env:VERSION" "/DExe=$PWD\Waffle.exe" "/O$PWD" packaging\windows\waffle.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Git Bash on Windows has sha256sum; macOS has shasum. Both print "<hex> <name>".
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          for file in ${{ matrix.files }}; do
            $sum "$file" > "$file.sha256"
            gh release upload "$TAG" "$file" "$file.sha256" --clobber
          done

  # Only once every target uploaded; a failed build leaves the release a draft and `latest` where it was.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
