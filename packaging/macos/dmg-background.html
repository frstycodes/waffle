<!doctype html>
<!-- The disk image window's background (660x400 points). Rendered by render-dmg-background.sh; Finder
     draws the two icons (centres 220,200 and 440,200) and their labels on top, so this holds only the
     scene. The label band stays #A66800: Finder's labels are black in light mode and white in dark, and
     that amber is 4.6:1 against both. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  .dmg { position: relative; width: 660px; height: 400px; overflow: hidden; isolation: isolate;
    background:
      radial-gradient(120% 90% at 8% -10%, #f7c561 0%, #e9a632 28%, transparent 58%),
      radial-gradient(90% 70% at 50% 118%, #7a4c00 0%, transparent 60%),
      #a66800; }
  .dmg::before { content: ""; position: absolute; inset: -60%; z-index: -1; transform: rotate(-10deg); opacity: .22;
    background:
      repeating-linear-gradient(0deg, transparent 0 86px, rgb(255 236 196 / .07) 86px 100px),
      repeating-linear-gradient(90deg, transparent 0 86px, rgb(255 236 196 / .07) 86px 100px); }
  .dipper { position: absolute; width: 300px; right: -78px; top: -92px; transform: rotate(8deg); filter: drop-shadow(0 18px 24px rgb(74 40 0 / .45)); }
  .waffle { position: absolute; width: 146px; left: -28px; bottom: -36px; transform: rotate(-16deg); filter: drop-shadow(0 14px 18px rgb(74 40 0 / .45)); }
  .arrow { position: absolute; left: 300px; top: 170px; overflow: visible; }
  .hint { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font: 600 14px/1.3 "Figtree", sans-serif; letter-spacing: .005em; color: rgb(255 244 222 / .82); }
</style>
</head>
<body>
<div class="dmg">
  <img class="dipper" src="../../assets/illustrations/installer-dipper.png" alt="">
  <img class="waffle" src="../../assets/illustrations/installer-waffle.png" alt="">
  <svg class="arrow" width="62" height="44" viewBox="0 0 62 44" aria-hidden="true"><path d="M6 30C20 12 40 10 54 20M43 19.9 54 20l-3.7-10.4" stroke="rgb(255 244 222 / .9)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  <div class="hint">Drag Waffle into Applications</div>
</div>
</body>
</html>
