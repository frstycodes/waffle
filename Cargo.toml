[package]
name = "waffle"
version = "0.18.0"
edition = "2024"
publish = false

[[bin]]
name = "waffle"
path = "src/main.rs"

# `cargo build --release --features dhat-heap`: records where every allocation comes from and writes
# dhat-heap.json after WAFFLE_DHAT_SECS (default 60); open it at https://nnethercote.github.io/dh_view/dh_view.html
[features]
dhat-heap = ["dep:dhat"]

[dependencies]
dhat = { version = "0.3", optional = true }
anyhow = "1"
backtrace = "0.3"
bytes = "1"
gpui-kit = { version = "=0.10.0", features = ["component", "assets", "tree-sitter-languages", "gpui-fast"] }
gpui-motion-kit = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream", "cookies"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Discord's display-name fonts: its .woff2 files decoded to TTF, its client build read for the font table.
wuff = { version = "0.2", default-features = false, features = ["brotli"] }
brotli-decompressor = "6"
ttf-parser = "0.25"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
# QR sign-in tells Discord the zone and language a browser would.
iana-time-zone = "0.1"
sys-locale = "0.3"
qrcode = { version = "0.14", default-features = false }
emojis = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
davey = "0.2"
opus = "0.4"
cpal = "0.18"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
openh264 = "0.9"
mp4 = "0.14"
notify-rust = "4"
sonora = "0.3"
# Already in the tree through sonora; the offline echo check measures in the frequency domain.
rustfft = "6.4"
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"] }
nnnoiseless = { version = "0.5.2", default-features = false }
# DeepFilterNet3 (MIT/Apache-2.0) with its bundled model on the tract backend: the Krisp-tier noise
# suppressor. crates.io only has the pre-tract 0.2 line, so this pins the upstream repo.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "7b14b895fe7fc42cab72b4a4c1e49c982bd6404b", default-features = false, features = ["tract", "default-model"] }
# deep_filter is written against ndarray 0.15; tract moved to ndarray 0.16 in 0.21.7, so tract stays
# on 0.21.4, the version upstream's own lockfile builds with (0.21.5+ renamed `symbol_table`).
ndarray = "0.15"
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
# Port of WebRTC's GMM voice activity detector: what Discord runs for automatic sensitivity
# without Advanced Voice Activity (vadAutoThreshold = VERY_AGGRESSIVE). 0.1 is the WebRTC port.
earshot = "=0.1.0"
socket2 = "0.6"
# webrtc-rs (a Rust port of Pion): RTP/RTCP packets, H.264 (de)packetization and NACK, the
# generic layer Discord's client gets from libwebrtc.
rtp = "0.17"
rtcp = "0.17"
interceptor = "0.17"
webrtc-util = { version = "0.17", default-features = false, features = ["marshal"] }
async-trait = "0.1"
# The activity frame: WKWebView on macOS, WebView2 on Windows, placed as a child of the gpui window.
wry = { version = "0.57", default-features = false }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "symphonia-aac", "wav", "flac", "vorbis", "mp4"] }

[dev-dependencies]
# Headless windows for the tests/gpui_*.rs checks of the vendored gpui patches.
gpui-kit = { version = "=0.10.0", features = ["test-support"] }

[build-dependencies]
# Same version gpui-pre already builds with; only used for Windows targets.
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "NSWorkspace", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSProcessInfo"] }
screencapturekit = { version = "11", features = ["macos_14_0"] }
# Process footprint for the memory report (proc_pid_rusage) and game detection (libproc, sysctl).
libc = "0.2"
# The sidebar's native material: the window's NSView, to put an NSVisualEffectView under it.
raw-window-handle = "0.6"

# Full debug info made each worktree's target/ tens of GB. Backtraces keep file:line; a debugger
# loses locals in our code and everything in dependencies. Not "line-tables-only": inlined frames
# then lose their module path, which the memory report's frame filter matches on.
[profile.dev]
debug = "limited"

# RSA key generation takes seconds unoptimised; dependencies build optimised even in debug.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
debug = false

# tract 0.21.4's debug-only graph check rejects DeepFilterNet3's encoder ("duplicate name
# /convt3/Conv.bias") although release builds run it fine; debug builds skip the check like release.
[profile.dev.package.tract-core]
debug-assertions = false
# Function names for the memory report's allocation sites (WAFFLE_MEMORY_SITES=1). On Windows they
# go in a separate .pdb, so the exe doesn't grow; only the crates whose allocations matter.
[profile.release.package.waffle]
debug = "line-tables-only"
[profile.release.package.gpui-pre]
debug = "line-tables-only"
[profile.release.package.image]
debug = "line-tables-only"
[profile.release.package.openh264]
debug = "line-tables-only"

# Go Live on Windows: Windows.Graphics.Capture for video, WASAPI (process) loopback for audio, and the
# Media Foundation H.264 encoder (hardware MFTs: NVENC, Quick Sync, AMF) with OpenH264 as fallback.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0"
wasapi = "0.27"
# Close-to-tray: the tray icon and its menu.
tray-icon = "0.26"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# Waffle's gpui patches (transforms, squircle corners, backdrop blur), applied to vendored copies of the
# exact versions gpui-kit pins. Drop each crate here once upstream ships the same feature.
[patch.crates-io]
# gpui-fast, which the app draws with, carrying Waffle's patches: squircles, transforms, backdrop blur, page
# zoom, smooth mouse wheels, window drag areas and tooltip placement. gpui-kit still builds gpui-pre beside
# it, unpatched and unused.
gpui-fast = { path = "vendor/gpui-fast" }
gpui-fast-apple = { path = "vendor/gpui-fast-apple" }
gpui-fast-macos = { path = "vendor/gpui-fast-macos" }
gpui-fast-wgpu = { path = "vendor/gpui-fast-wgpu" }
gpui-fast-windows = { path = "vendor/gpui-fast-windows" }
# Links in rendered markdown carry no underline; scrollbars ignore a pixel of layout rounding.
gpui-base = { path = "vendor/gpui-base" }
# gpui-motion-kit 0.5 pins gpui-kit 0.7.3 and has no release for 0.10; this copy lifts that pin.
gpui-motion-kit = { path = "vendor/gpui-motion-kit" }
# gpui-fast implements IntoElement for every Element, so these copies drop their own identity impls.
gpui-ce-motion = { path = "vendor/gpui-ce-motion" }
